# Livrare (F1.8, secțiunea 22.8, pașii 3): după ce CI trece pe `main`, construiește imaginea și o publică în GHCR.
# Nu are acces la server și nu face SSH: serviciul intern `deployer` de pe VPS preia singur imaginea (docs/specs/F1.8.md).
name: Livrare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: entrega
  cancel-in-progress: false

jobs:
  imagine:
    # Doar pentru push pe main, cu CI reușit. Un workflow_run rulează cu drepturile ramurii implicite,
    # de aceea nu se construiește niciodată cod din cereri de integrare (event = pull_request).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Numele imaginii (litere mici)
        id: nume
        run: echo "imagine=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire și publicare
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: AMA_VERSION=${{ env.SHA }}
          tags: |
            ${{ steps.nume.outputs.imagine }}:${{ env.SHA }}
            ${{ steps.nume.outputs.imagine }}:main
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Rezumat
        run: |
          {
            echo "Imagine publicată: \`${{ steps.nume.outputs.imagine }}@${{ steps.build.outputs.digest }}\`"
            echo "Commit: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
