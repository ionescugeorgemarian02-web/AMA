name: Pilot AMA cu Claude
on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelul disponibil în contul Anthropic
        required: true
        type: string
        default: claude-sonnet-4-5
permissions:
  contents: read
jobs:
  campanie:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        caz: [magazin, servicii]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --locked
      - name: Instrumente de randare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg fonts-dejavu-core
          npm install --prefix "$RUNNER_TEMP/ama-media" playwright@1.56.1
          "$RUNNER_TEMP/ama-media/node_modules/.bin/playwright" install --with-deps chromium
          echo "AMA_PLAYWRIGHT=$RUNNER_TEMP/ama-media/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Campanie din dosar client
        run: uv run pytest -q tests/integration/test_pilot_claude.py
        env:
          AMA_ENV: test
          AMA_PILOT_CLAUDE: "1"
          AMA_TEST_PLAFON_SEC: "3400"
          AMA_PILOT_MODEL: ${{ inputs.model }}
          AMA_PILOT_CAZ: ${{ matrix.caz }}
          AMA_PILOT_IESIRE: rezultate
          AMA_CHEIE_PILOT: ${{ secrets.ANTHROPIC_API_KEY }}
          AMA_TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres # pragma: allowlist secret
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot-${{ matrix.caz }}
          path: rezultate/
