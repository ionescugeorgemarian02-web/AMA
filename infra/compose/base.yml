# Definițiile comune ale unei stive (staging sau producție). Nu se pornește singur:
#   docker compose -p ama-staging --env-file /srv/ama/env/staging.env -f base.yml -f staging.yml ...
# Serviciile interne (postgres, migrate) stau doar în rețeaua internă; nimic nu publică porturi pe gazdă.
# Imaginile aplicației vin din deployer: AMA_IMAGE_BLUE / AMA_IMAGE_GREEN / AMA_IMAGE_MIGRATE (depozit@sha256:…).

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 20s
  depends_on:
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  environment:
    AMA_ENV: ${AMA_ENV:?}
    AMA_BASE_URL: ${AMA_BASE_URL:?}
    AMA_DATABASE_URL: postgresql+psycopg://ama_app:${AMA_APP_DB_PASSWORD:?}@postgres:5432/ama
    AMA_SECRET_KEY: ${AMA_SECRET_KEY:?}
    AMA_MASTER_KEY: ${AMA_MASTER_KEY:?}
    AMA_DEPLOY_TOKEN: ${AMA_DEPLOY_TOKEN:-}
    # Notificări push și Telegram (F1.7, F1.10). Goale = dezactivate.
    AMA_VAPID_PUBLIC_KEY: ${AMA_VAPID_PUBLIC_KEY:-}
    AMA_VAPID_PRIVATE_KEY: ${AMA_VAPID_PRIVATE_KEY:-}
    AMA_VAPID_SUBJECT: ${AMA_VAPID_SUBJECT:-mailto:admin@example.invalid}
    AMA_TELEGRAM_BOT_TOKEN: ${AMA_TELEGRAM_BOT_TOKEN:-}
    AMA_TELEGRAM_CHAT_ID: ${AMA_TELEGRAM_CHAT_ID:-}
    AMA_TELEGRAM_WEBHOOK_SECRET: ${AMA_TELEGRAM_WEBHOOK_SECRET:-}
    AMA_MEDIA_DIR: /var/lib/ama/media
    UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
  volumes:
    - media:/var/lib/ama/media
  networks:
    internal: {}
    edge: {}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: ama
      AMA_OWNER_DB_PASSWORD: ${AMA_OWNER_DB_PASSWORD:?}
      AMA_APP_DB_PASSWORD: ${AMA_APP_DB_PASSWORD:?}
      AMA_BACKUP_DB_PASSWORD: ${AMA_BACKUP_DB_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${AMA_INFRA_DIR:?}/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ama"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      internal: {}

  # Pas unic: migrările rulează ca proprietar al bazei, înaintea oricărui slot de aplicație.
  migrate:
    image: ${AMA_IMAGE_MIGRATE:-${AMA_IMAGE_BLUE:-${AMA_IMAGE_GREEN:-ama-unset:none}}}
    restart: "no"
    # Două pași, în ordine, ambii ca proprietar: schema aplicației (Alembic), apoi schema bibliotecii de
    # workflow-uri (F2.1). Aplicația rulează ca `ama_app` și nu are drept de DDL.
    command: ["sh", "-c", "alembic upgrade head && python -m app.operare.motor.migrare"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      AMA_ENV: ${AMA_ENV:?}
      AMA_DATABASE_OWNER_URL: postgresql+psycopg://ama_owner:${AMA_OWNER_DB_PASSWORD:?}@postgres:5432/ama
      AMA_DATABASE_URL: postgresql+psycopg://ama_owner:${AMA_OWNER_DB_PASSWORD:?}@postgres:5432/ama
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      internal: {}

  # Executorul fluxurilor durabile (F2.1). Procesul web doar pune joburi în coadă; execuția are loc aici.
  # `restart: unless-stopped` este mecanismul din 22.3: dacă workerul cade, Docker îl repornește, iar la pornire
  # își reia (cu același AMA_WORKER_ID) joburile rămase în lucru, de la ultimul pas salvat.
  # Imaginea o mută deployer-ul odată cu slotul activ (AMA_IMAGE_WORKER).
  worker:
    image: ${AMA_IMAGE_WORKER:-ama-unset:none}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s  # peste AMA_WORKER_OPRIRE_SEC (20): joburile în curs își termină pasul
    healthcheck:  # semn de viață recent în baza de date (watchdog, F2.7); vizibil în `docker ps`
      test: ["CMD", "python", "-m", "app.worker", "--verifica"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      AMA_ENV: ${AMA_ENV:?}
      AMA_BASE_URL: ${AMA_BASE_URL:?}
      AMA_DATABASE_URL: postgresql+psycopg://ama_app:${AMA_APP_DB_PASSWORD:?}@postgres:5432/ama
      AMA_SECRET_KEY: ${AMA_SECRET_KEY:?}
      AMA_MASTER_KEY: ${AMA_MASTER_KEY:?}
      AMA_WORKER_ID: ${AMA_WORKER_ID:-worker-1}
      AMA_WORKER_OPRIRE_SEC: "20"
      AMA_CULOARE_GREU: ${AMA_CULOARE_GREU:-2}
      # Alertele (push, Telegram) pleacă și din worker (F2.7).
      AMA_VAPID_PUBLIC_KEY: ${AMA_VAPID_PUBLIC_KEY:-}
      AMA_VAPID_PRIVATE_KEY: ${AMA_VAPID_PRIVATE_KEY:-}
      AMA_VAPID_SUBJECT: ${AMA_VAPID_SUBJECT:-mailto:admin@example.invalid}
      AMA_TELEGRAM_BOT_TOKEN: ${AMA_TELEGRAM_BOT_TOKEN:-}
      AMA_TELEGRAM_CHAT_ID: ${AMA_TELEGRAM_CHAT_ID:-}
      AMA_TELEGRAM_WEBHOOK_SECRET: ${AMA_TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - media:/var/lib/ama/media
    networks:
      internal: {}
      edge: {}

  # Modelul local de text (F3.5, 6.3–6.4): server llama.cpp separat, model ținut încărcat (`--mlock`), UN singur slot
  # (`--parallel 1`): cât generează, ocupă un culoar greu al cozii `greu`. Aplicația îl cheamă prin gateway
  # (`http://local-llm:8080/v1`, furnizorul `local` din registru), doar din joburi de pe coada `greu`.
  # NEVERIFICAT: imaginea (llama.cpp, varianta `server`) NU este fixată pe amprentă — digestul se află la migrarea pe VPS
  # și se pune în AMA_IMAGE_LOCAL_LLM (depozit@sha256:…); până atunci serviciul e în profilul `local-llm` și nu pornește
  # (COMPOSE_PROFILES=local-llm). Fișierul modelului (.gguf) se pune în volumul `modele`; limita de memorie (6,5 GB) e din 6.4.
  # NEVERIFICAT: comanda, steagurile și healthcheck-ul nu au rulat pe o imagine reală.
  local-llm:
    image: ${AMA_IMAGE_LOCAL_LLM:-ama-unset:none}
    profiles: ["local-llm"]
    restart: unless-stopped
    command: ["--model", "/modele/${AMA_MODEL_LOCAL:-model-local.gguf}", "--host", "0.0.0.0", "--port", "8080",
              "--ctx-size", "8192", "--parallel", "1", "--mlock", "--threads", "${AMA_LOCAL_FIRE:-4}"]
    mem_limit: 6500m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - modele:/modele:ro
    networks:
      internal: {}

  # Modelul de vectori (F3.5, 10.5): același tip de server, alt model (multilingv mic), în afara culoarelor grele.
  # Aceleași NEVERIFICAT-uri ca mai sus; memorie mică, fără rezervare de culoar.
  embeddings:
    image: ${AMA_IMAGE_LOCAL_LLM:-ama-unset:none}
    profiles: ["local-llm"]
    restart: unless-stopped
    command: ["--model", "/modele/${AMA_MODEL_VECTORI:-model-vectori.gguf}", "--host", "0.0.0.0", "--port", "8081",
              "--embedding", "--ctx-size", "512", "--parallel", "2", "--threads", "2"]
    mem_limit: 700m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - modele:/modele:ro
    networks:
      internal: {}

  app_blue:
    <<: *app
    image: ${AMA_IMAGE_BLUE:-ama-unset:none}

  app_green:
    <<: *app
    image: ${AMA_IMAGE_GREEN:-ama-unset:none}

volumes:
  pgdata: {}
  modele: {}
  media: {}

networks:
  internal:
    internal: true
  edge:
    name: ama-edge
    external: true
