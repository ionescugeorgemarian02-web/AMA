[sedila]
# ş ţ Ş Ţ (cu sedilă, U+015F U+0163 U+015E U+0162) → ș ț Ș Ț (cu virgulă, U+0219 U+021B U+0218 U+021A)
literele = { "ş" = "ș", "ţ" = "ț", "Ş" = "Ș", "Ţ" = "Ț" }

[diacritice]
# raportul literelor cu diacritice românești în textul scris corect este de ordinul a 8–9%; sub acest prag, într-un
# text de cel puțin `cuvinte_minim` cuvinte, diacriticele lipsesc cu totul.
prag_raport_minim = 0.005
cuvinte_minim = 25
# o singură greșeală din dicționar → avertisment; de atâtea ori sau mai mult → eșec
greseli_pentru_esec = 2

[i_a]
# „î” în interiorul cuvântului este corect doar după aceste prefixe (neînțeles, reîncepe, preîntâmpina …)
prefixe_cu_i = ["ne", "re", "pre", "sub", "supra", "auto", "anti", "co", "de", "dez", "ex", "extra", "inter",
                "intra", "mini", "mega", "micro", "multi", "neo", "pan", "post", "proto", "semi", "super", "tele",
                "trans", "ultra", "vice", "contra", "radio", "bine", "prea"]

[detectie_limba]
