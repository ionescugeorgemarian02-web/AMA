<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}AMA{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b5d6b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a1f" media="(prefers-color-scheme: dark)">
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AMA">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/css/tema.css">
  <script src="/static/js/app.js" defer></script>
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/static/vendor/alpine-csp-3.14.9.min.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}{% block body_attr %}{% endblock %}>
  {% block shell %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
