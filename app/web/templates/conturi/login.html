{% extends "base.html" %}
{% block title %}Autentificare · AMA{% endblock %}
{% block content %}
<h1>Autentificare</h1>
{% if eroare %}<p role="alert" id="eroare">{{ eroare }}</p>{% endif %}
<form method="post" action="/conturi/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p><label>Email <input type="email" name="email" autocomplete="username" maxlength="254" required></label></p>
  <p><label>Parolă <input type="password" name="parola" autocomplete="current-password" maxlength="1024" required></label></p>
  <p><button type="submit">Intră</button></p>
</form>
{% endblock %}
