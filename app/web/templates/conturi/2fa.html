{% extends "base.html" %}
{% block title %}Al doilea factor · AMA{% endblock %}
{% block content %}
<h1>Al doilea factor</h1>
<p>Introdu codul din aplicația de autentificare sau un cod de recuperare.</p>
{% if eroare %}<p role="alert" id="eroare">{{ eroare }}</p>{% endif %}
<form method="post" action="/conturi/2fa">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p><label>Cod <input type="text" name="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="64" required></label></p>
  <p><button type="submit">Verifică</button></p>
</form>
{% endblock %}
