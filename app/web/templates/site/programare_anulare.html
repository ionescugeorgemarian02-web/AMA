{% extends "site/baza.html" %}
{% block continut %}
{% if stare == "anulata" %}
<h1>Apel anulat</h1>
<p class="ok">Apelul de {{ cand }} nu mai are loc. Poți alege oricând alt interval din <a href="/site/programare">pagina de programare</a>.</p>
{% else %}
<h1>Anulezi apelul?</h1>
<p>Apelul e programat {{ cand }} (ora României).</p>
<form method="post" action="/site/programare/anulare/{{ jeton }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit">Anulează apelul</button>
</form>
{% endif %}
{% endblock %}
