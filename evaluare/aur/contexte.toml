nume = "Amestecul Zorilor 1 kg"
pret = "119"

[[contexte.zorilor.surse]]
statut = "site_concurenta"
nume = "Prăjitoria Nordului (site public)"
texte = [
  "Prăjitoria Nordului prepară cafea de specialitate în loturi foarte mici, direct din boabe verzi aduse din Etiopia, apoi o ambalează manual și o trimite în toată țara în cel mult patru zile de la comandă.",
  "La Prăjitoria Nordului fiecare client primește împreună cu pachetul un card cu sfaturi de preparare, scrise de maestrul nostru prăjitor, ca să obții acasă aceeași ceașcă pe care o gusti la degustările din atelier.",
]

[[contexte.zorilor.surse]]
