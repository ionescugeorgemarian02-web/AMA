# --- Un context cu doar un ghid mai sobru (pentru G4 / G8 pe canale formale) -------------------------------------------------
[contexte.birou]
nume = "Cabinet de contabilitate (ton sobru)"

[contexte.birou.ghid]
nume = "Contabilul de încredere"
descriere = "Ton calm, clar și respectuos, cu explicații scurte, fără jargon și fără glume."
reguli_da = ["Explică termenii", "Dă termene exacte"]
reguli_nu = ["Nu promite reduceri de taxe", "Nu folosi argou"]
vocabular_preferat = ["declarație", "termen", "documente", "clarificare"]
vocabular_interzis = ["fentăm", "scăpăm", "evaziune"]
exemple = [
  { canal = "linkedin", text = "Termenul pentru depunerea declarației se apropie. Pregătește documentele din timp, iar noi te ajutăm să le verifici împreună." },
  { canal = "email", text = "Bună ziua, vă transmitem lista documentelor necesare pentru închiderea lunii. Ne puteți scrie oricând pentru clarificări." },
  { canal = "facebook", text = "În fiecare lună explicăm pe scurt un termen contabil, ca declarațiile tale să fie mai ușor de înțeles." },
]

[[contexte.birou.fapte]]
tip = "program"
subiect = "Program"
afirmatie = "Cabinetul primește clienți de luni până joi între 9:00 și 16:00"

[[contexte.birou.fapte]]
tip = "pret"
subiect = "Consultanță"
afirmatie = "O oră de consultanță costă 150 lei"
valoare = { numar = "150", moneda = "RON" }
