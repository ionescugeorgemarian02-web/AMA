# Profilurile de context ale seturilor de aur (F5.7). Totul este INVENTAT: firme, produse, prețuri, texte. Nicio persoană,
# adresă, telefon sau email real. Momentele sunt relative la `la`, nu la ceasul real. Fiecare exemplu trimite la un profil
# prin `ctx`; bancul construiește profilul într-o tranzacție anulată (vezi app/validare/banc/context.py).

[meta]
la = "2026-11-12T12:00:00Z"

[contexte.gol]
nume = "Fără nicio informație despre client"

# --- Cafeneaua Zorilor: prăjitorie de cafea de specialitate (fictivă) --------------------------------------------------
[contexte.zorilor]
nume = "Cafeneaua Zorilor (prăjitorie, Brașov)"

[contexte.zorilor.ghid]
nume = "Barista prietenos"
descriere = "Brandul sună cald și simplu, ca un barista care explică pe îndelete, fără cuvinte pretențioase."
reguli_da = ["Spune pe nume ce e în pachet", "Dă data prăjirii", "Invită la degustare"]
reguli_nu = ["Nu promite efecte medicale", "Nu compara cu alte firme"]
vocabular_preferat = ["proaspăt", "degustare", "prăjit în loturi mici", "boabe"]
vocabular_interzis = ["ieftin", "miraculos", "revoluționar"]
exemple = [
  { canal = "facebook", text = "Sâmbătă la 11:00 facem degustare gratuită la cafenea, vino să guști cafea proaspăt prăjită și să afli cum o prepari acasă." },
  { canal = "email", text = "Salut! Pachetul tău de cafea pleacă marți, proaspăt prăjit, direct din cafeneaua noastră din Brașov." },
  { canal = "site", text = "Prăjim cafeaua în loturi mici, ca fiecare pachet să ajungă proaspăt la tine acasă, cu data prăjirii pe etichetă." },
]

[[contexte.zorilor.fapte]]
tip = "termen"
subiect = "Livrare"
afirmatie = "Livrăm în 2-3 zile lucrătoare în toată țara"
valoare = { text = "2-3 zile" }

[[contexte.zorilor.fapte]]
tip = "garantie"
subiect = "Garanție"
afirmatie = "Garanție: schimbăm cafeaua dacă nu ți-a plăcut, fără întrebări"

[[contexte.zorilor.fapte]]
tip = "program"
subiect = "Program"
afirmatie = "Cafeneaua este deschisă de luni până vineri între 8:00 și 18:00, iar sâmbăta între 9:00 și 14:00"

[[contexte.zorilor.fapte]]
tip = "cifra"
subiect = "Echipa"
afirmatie = "Echipa Cafeneaua Zorilor are 8 angajați"
valoare = { numar = "8" }

[[contexte.zorilor.fapte]]
tip = "cifra"
subiect = "Înființare"
afirmatie = "Cafeneaua Zorilor a fost înființată în 2014"
valoare = { numar = "2014" }

[[contexte.zorilor.fapte]]
tip = "adresa"
subiect = "Adresă"
afirmatie = "Cafeneaua Zorilor se află pe Strada Fabricii nr. 12, în Brașov"

[[contexte.zorilor.fapte]]
tip = "caracteristica"
subiect = "Prăjire"
afirmatie = "Prăjim cafeaua în loturi mici, de maximum 12 kilograme"

[[contexte.zorilor.fapte]]
tip = "program"
subiect = "Degustare"
afirmatie = "Degustarea este în prima sâmbătă a lunii, de la ora 11:00"

[[contexte.zorilor.oferte]]
tip = "abonament"
nume = "Abonament Lunar"
pret = "89"
descriere = "Două pachete de 250 g pe lună, alese de noi"

[[contexte.zorilor.oferte]]
tip = "promotie"
nume = "Pachet Etiopia Guji 250 g"
pret = "49"
pret_referinta = "59"
istoric = [["59", 60]]

[[contexte.zorilor.oferte]]
tip = "produs"
nume = "Columbia Huila 250 g"
pret = "42"

[[contexte.zorilor.oferte]]
