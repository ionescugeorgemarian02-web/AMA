[project]
name = "ama"
version = "0.1.0"
description = "Agenția Autonomă de Marketing"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "fastapi==0.162.4",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "pyotp==2.10.0",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # diacritice românești în texte

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"migrations/**" = ["S608"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "db: testul are nevoie de Postgres",
    "isolation: test de izolare între clienți",
]
