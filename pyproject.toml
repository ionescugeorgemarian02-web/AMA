[project]
name = "ama"
version = "0.1.0"
description = "Agenția Autonomă de Marketing"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "dbos==3.5.0",
    "fastapi==0.162.4",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "pyotp==2.10.0",
    "python-multipart==0.0.33",
    "pywebpush==2.3.0",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # diacritice românești în texte

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "E501"]  # S608: nume de tabele constante; E501: SQL
"migrations/**" = ["S608", "E501"]  # SQL pe o linie
"scripts/**" = ["S603", "S607"]
"app/media/**" = ["S603"]  # ffmpeg / ffprobe / piper: liste de argumente construite în cod, fără shell

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["pywebpush"]
ignore_missing_imports = true  # biblioteca nu are adnotări de tip

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# Dacă un test durează peste 100 s, tracebackurile tuturor firelor ajung în jurnal (biblioteca standard), înainte să
# taie plafonul din tests/conftest.py (120 s) testul: se vede unde stă blocat.
faulthandler_timeout = 100
markers = [
    "db: testul are nevoie de Postgres",
    "isolation: test de izolare între clienți",
]
